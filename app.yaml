apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulplabs-site
  namespace: pulplabs
  labels:
    app.kubernetes.io/name: pulplabs-site
    app.kubernetes.io/part-of: pulplabs
spec:
  progressDeadlineSeconds: 300
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: pulplabs-site
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulplabs-site
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: pulplabs-config
        - secretRef:
            name: pulplabs-secrets
        image: pulplabs-site
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 20
          successThreshold: 1
          tcpSocket:
            port: http
          timeoutSeconds: 3
        name: site
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            memory: 1536Mi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        startupProbe:
          failureThreshold: 12
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /app/.next/cache
          name: cache
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - mkdir -p /data/uploads
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        name: prepare-data
        resources: {}
        securityContext:
          runAsGroup: 10001
          runAsUser: 10001
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
      nodeSelector:
        kubernetes.io/hostname: pulp-worker-2
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: pulplabs-site
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pulplabs-data
      - emptyDir: {}
        name: cache
      - emptyDir: {}
        name: tmp
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: pulplabs-site
  namespace: pulplabs
  labels:
    app.kubernetes.io/name: pulplabs-site
    app.kubernetes.io/part-of: pulplabs
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ports:
  - name: http
    nodePort: 30081
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: pulplabs-site
  sessionAffinity: None
  type: NodePort
