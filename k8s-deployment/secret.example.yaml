# Template only. Copy to secret.yaml, fill in real values, and apply that.
# secret.yaml is gitignored: these are live credentials and they do not belong
# in the repository or in a container image.
#
#   cp secret.example.yaml secret.yaml
#   $EDITOR secret.yaml
#   kubectl apply -f secret.yaml
#
# Or skip the file entirely and create it from the command line, which keeps the
# values out of your shell history if you use a leading space:
#
#   kubectl create secret generic pulplabs-secrets -n pulplabs \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=API_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=GROQ_API_KEY=... \
#     --from-literal=RESEND_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: pulplabs-secrets
  namespace: pulplabs
  labels:
    app.kubernetes.io/name: pulplabs-site
type: Opaque
stringData:
  # Signs the admin session cookie. Generate with `openssl rand -hex 32`.
  # Changing it logs every admin out, which is the intended way to revoke.
  SESSION_SECRET: "replace-me-openssl-rand-hex-32"

  # Guards the write endpoints under /api. Generate the same way.
  API_TOKEN: "replace-me-openssl-rand-hex-32"

  # Site assistant. Without it /api/assistant still answers, from the offline
  # intent matcher rather than the model.
  GROQ_API_KEY: ""

  # Contact form and job applications. Without a mail provider the enquiry and
  # application routes still persist to the database, so a lead is never lost;
  # only the notification email is.
  RESEND_API_KEY: ""
  ENQUIRY_FROM: "PulpLabs <onboarding@resend.dev>"

  # Alternative to Resend. Leave blank unless you are using SMTP directly.
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_SECURE: ""
  SMTP_USER: ""
  SMTP_PASS: ""
