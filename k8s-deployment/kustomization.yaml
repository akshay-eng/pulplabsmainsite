# secret.yaml is not listed. It holds live credentials, it is gitignored, and
# it is applied separately so that `kubectl apply -k .` on a fresh clone fails
# loudly with a missing secret rather than quietly deploying without one.
#
# seed-job.yaml is also excluded: it is a one-shot run against an empty volume,
# not part of the steady-state manifest set. Apply it by name when you need it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pulplabs

resources:
  - namespace.yaml
  - pvc.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# `labels` rather than the deprecated `commonLabels`, and without
# includeSelectors on purpose. commonLabels writes into the Deployment's
# selector, and a selector is immutable once applied: changing a label here
# later would make every subsequent apply fail with a field-is-immutable error
# that can only be cleared by deleting the Deployment. The selector it needs is
# already declared explicitly in deployment.yaml.
labels:
  - pairs:
      app.kubernetes.io/name: pulplabs-site
      app.kubernetes.io/part-of: pulplabs

# Pinned to an immutable tag rather than :latest. With imagePullPolicy
# IfNotPresent a floating tag is never re-pulled once the node has a copy, so
# a redeploy silently keeps serving the old image. Bump this line to roll out.
#
# The -amd64 suffix is not decoration: :latest on Docker Hub is currently the
# arm64 build, and this cluster's only node is amd64, so pulling :latest here
# fails with "no matching manifest for linux/amd64".
images:
  - name: ak3hay/pulplabs-site
    newTag: 3aeb0dc-amd64
