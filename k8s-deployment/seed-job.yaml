# One-shot seed for a fresh volume: creates the admin user and imports the
# posts and case studies.
#
# Run it once, after the PVC exists and before or just after the first deploy.
# It is a Job rather than an initContainer because seeding is a first-boot
# action, not something that should re-run on every restart.
#
# The Deployment must be scaled to zero while this runs. The volume is
# ReadWriteOnce and SQLite is single-writer, so the Job and the site cannot
# hold it at the same time:
#
#   kubectl scale deploy/pulplabs-site -n pulplabs --replicas=0
#   kubectl apply -f seed-job.yaml
#   kubectl wait --for=condition=complete job/pulplabs-seed -n pulplabs --timeout=300s
#   kubectl scale deploy/pulplabs-site -n pulplabs --replicas=1
apiVersion: batch/v1
kind: Job
metadata:
  name: pulplabs-seed
  namespace: pulplabs
  labels:
    app.kubernetes.io/name: pulplabs-site
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulplabs-site
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: seed
          # Keep this tag in step with kustomization.yaml. The Job is not part
          # of the kustomization, so the image transformer there does not reach
          # it, and :latest on Docker Hub is the arm64 build which will not run
          # on an amd64 node.
          image: ak3hay/pulplabs-site:cd80ef7-amd64
          # Posts first, then case studies. Both are idempotent, so re-running
          # the Job against a populated volume is safe.
          command: ['sh', '-c', 'node scripts/seed.mjs && node scripts/seed-cases.mjs']

          # Set ADMIN_EMAIL and ADMIN_PASSWORD here to create the admin login.
          # Left out deliberately: seed.mjs only creates the user when both are
          # present, and the password should be chosen by you rather than
          # generated into a file. See the README.
          envFrom:
            - configMapRef:
                name: pulplabs-config
            - secretRef:
                name: pulplabs-secrets
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pulplabs-data
