# Assumes ingress-nginx and cert-manager, which is the common pairing. If your
# cluster runs Traefik, GKE ingress or an ALB controller, the annotations and
# ingressClassName are what change; the rules below stay as they are.
#
# Both hosts are listed so the apex and www resolve, and the redirect between
# them is left to DNS or the load balancer rather than being hardcoded here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulplabs-site
  namespace: pulplabs
  labels:
    app.kubernetes.io/name: pulplabs-site
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # CV uploads. The default is 1MB, which rejects a PDF résumé with a bare
    # 413 and no message the candidate can act on.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Required with Cloudflare Tunnel, and it is not optional.
    #
    # TLS terminates at Cloudflare's edge and cloudflared speaks plain HTTP to
    # this controller. ingress-nginx sees a TLS block below, assumes it is
    # serving HTTPS itself, and 308-redirects every HTTP request to HTTPS. The
    # redirect goes back out to Cloudflare, which sends it down the tunnel as
    # HTTP again: an infinite loop, and the browser shows ERR_TOO_MANY_REDIRECTS
    # with nothing useful in any log.
    #
    # Turn this back on the day cert-manager issues a real certificate here and
    # the origin genuinely serves HTTPS.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pulplabs.ai
        - www.pulplabs.ai
      secretName: pulplabs-tls
  rules:
    - host: pulplabs.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulplabs-site
                port:
                  name: http
    - host: www.pulplabs.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulplabs-site
                port:
                  name: http
