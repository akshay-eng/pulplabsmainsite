# Cloudflare Tunnel: how pulplabs.ai reaches a server with no static IP.
#
# WHY A TUNNEL RATHER THAN AN A RECORD
#
# The obvious route is a Cloudflare A record kept current by dynamic DNS. It
# works only if the router can forward ports 80 and 443 inbound to 192.168.1.5.
# Most Indian residential ISPs use CGNAT, where the public IP is shared and
# inbound forwarding is not available at any price. Dynamic DNS does not rescue
# that: it points a name at an address that still refuses connections.
#
# cloudflared dials OUT and holds the connection open, so requests arrive back
# down that pipe. No inbound ports, works behind CGNAT, the changing IP stops
# mattering, the home IP is never published, and TLS terminating at Cloudflare's
# edge is also the answer to this cluster having no cert-manager.
#
# WHY LOCALLY MANAGED RATHER THAN A DASHBOARD TOKEN
#
# The Zero Trust dashboard now asks for a payment method before it will create a
# tunnel. The CLI goes through the zone API instead and does not, so the tunnel
# below was created with:
#
#   cloudflared tunnel login          # browser, authorises one zone
#   cloudflared tunnel create pulplabs
#   cloudflared tunnel route dns --overwrite-dns pulplabs www.pulplabs.ai
#
# The trade is that routing lives in the ConfigMap here rather than in the
# dashboard, which is the better half of the bargain: it is in the repo, it is
# reviewable, and it deploys with everything else.
#
# THE CREDENTIALS ARE NOT IN THIS FILE
#
# Creating the tunnel wrote ~/.cloudflared/8dc51ea9-1dca-4f72-b38d-a836f0b6f7d5.json.
# It is the tunnel's private key. Load it with:
#
#   kubectl create secret generic cloudflared-creds -n pulplabs \
#     --from-file=credentials.json=$HOME/.cloudflared/8dc51ea9-1dca-4f72-b38d-a836f0b6f7d5.json
#
# then: kubectl apply -f cloudflared.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: pulplabs
  labels:
    app.kubernetes.io/name: cloudflared
data:
  config.yaml: |
    tunnel: 8dc51ea9-1dca-4f72-b38d-a836f0b6f7d5
    credentials-file: /etc/cloudflared/creds/credentials.json
    # Must bind for the liveness probe below to have anything to ask.
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    # Straight at the site Service rather than through ingress-nginx. One hop
    # fewer, and it keeps the controller out of the path entirely so it cannot
    # 308 HTTP to HTTPS and produce the redirect loop described in ingress.yaml.
    #
    # Point at ingress-nginx-controller.ingress-nginx.svc.cluster.local:80
    # instead if one tunnel ever needs to carry several sites and you would
    # rather route by Ingress rule than by the list here.
    ingress:
      - hostname: pulplabs.ai
        service: http://pulplabs-site.pulplabs.svc.cluster.local:80
      - hostname: www.pulplabs.ai
        service: http://pulplabs-site.pulplabs.svc.cluster.local:80
      # Required: cloudflared refuses to start without a catch-all last rule.
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: pulplabs
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  # Two, so a pod restart does not take the site off the internet. They are
  # stateless and Cloudflare balances across whichever are connected.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.2.0
          args: ['tunnel', '--config', '/etc/cloudflared/config.yaml', 'run']
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-creds
