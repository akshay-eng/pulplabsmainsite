# Builds and pushes ak3hay/pulplabs-site for linux/amd64 and linux/arm64.
#
# This exists because amd64 cannot be cross-built on an Apple Silicon machine.
# Under the QEMU emulation buildx falls back to, `next build` segfaults partway
# through: "qemu: uncaught target signal 11" and a build worker exiting on
# SIGSEGV. Disabling Next's parallel workers gets it past compilation and it
# still dies later. The arm64 half builds natively and is fine, which is why the
# image currently on Docker Hub is arm64 only.
#
# Building each architecture on a runner of that architecture removes the
# emulation entirely. That is the fix; everything else is a workaround.
#
# Requires two repository secrets (Settings, Secrets and variables, Actions):
#   DOCKERHUB_USERNAME  ak3hay
#   DOCKERHUB_TOKEN     an access token from hub.docker.com/settings/security.
#                       A token, not the account password: it is scoped to what
#                       it needs and can be revoked on its own.
#
# ubuntu-24.04-arm is free on public repositories and included on GitHub Team
# and Enterprise. On a private repo on the free plan that runner is unavailable
# and the arm64 leg will not start. If that happens, drop the arm64 row from the
# matrix: amd64 is the half that cannot be built locally, and arm64 can be
# pushed from the Mac and joined with `docker buildx imagetools create`.
name: Build and push image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ak3hay/pulplabs-site

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushed by digest with no tag. Tags are attached in the merge job once
      # both architectures exist, so a half-finished build never becomes
      # :latest and nothing pulls an image missing its own platform.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://pulplabs.ai
            NEXT_PUBLIC_WHATSAPP=919448055577
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The digest is the only thing the merge job needs. Written as a filename
      # so the two legs cannot collide when their artifacts are downloaded into
      # one directory.
      - name: Record the digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      # Joins both per-architecture images under :latest and the short commit
      # SHA, so kubectl pulls the right one for whatever the node happens to be.
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          SHA=$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$SHA" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
