name: Build and deploy
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cicd-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
        - component: site
          key: pulplabs-site
          file: Dockerfile
          suffix: ''
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Choose immutable image name
      id: image
      shell: bash
      run: 'image="ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}"

        printf "name=%s\n" "$image" >> "$GITHUB_OUTPUT"

        '
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and publish
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: ${{ matrix.file }}
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        labels: 'org.opencontainers.image.source=https://github.com/${{ github.repository }}

          org.opencontainers.image.revision=${{ github.sha }}'
        build-args: 'NEXT_PUBLIC_SITE_URL=https://pulplabs.ai

          NEXT_PUBLIC_MAIN_SITE_URL=https://pulplabs.ai'
        cache-from: type=gha,scope=${{ matrix.component }}
        cache-to: type=gha,mode=max,scope=${{ matrix.component }}
        provenance: mode=min
    - name: Record image digest
      if: github.event_name != 'pull_request'
      env:
        IMAGE_NAME: ${{ steps.image.outputs.name }}
        IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        IMAGE_KEY: ${{ matrix.key }}
      run: 'python3 - <<''SCRIPT''

        import json,os,pathlib

        p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''image-digests'';p.mkdir(exist_ok=True)

        (p/(os.environ[''IMAGE_KEY'']+''.json'')).write_text(json.dumps({''name'':os.environ[''IMAGE_KEY''],''image'':os.environ[''IMAGE_NAME''],''digest'':os.environ[''IMAGE_DIGEST'']}))

        SCRIPT

        '
    - name: Upload digest
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: digest-${{ matrix.component }}
        path: ${{ runner.temp }}/image-digests/*.json
        retention-days: 7
        if-no-files-found: error
  release:
    name: Publish GitOps release
    if: github.event_name != 'pull_request'
    needs:
    - build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: digest-*
        merge-multiple: true
        path: ${{ runner.temp }}/image-digests
    - name: Verify cluster can pull every image
      env:
        DIGEST_DIR: ${{ runner.temp }}/image-digests
      run: python3 .github/scripts/check-image-access.py
    - name: Update deployment branch
      env:
        DIGEST_DIR: ${{ runner.temp }}/image-digests
      run: python3 .github/scripts/publish-release.py
