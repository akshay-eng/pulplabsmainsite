<!-- The site's own mark, not the retired citrus wheel.
     
     Geometry matches the nav exactly (src/components/void/Nav.jsx), scaled from
     its 20x20 viewBox to 100x100. Stroke weight does NOT match: the nav's 1.6
     becomes 8 at this scale, which renders 1.28px in a 16px tab and looks
     anaemic. 11 gives about 1.76px, which holds. Checked by rasterising at 16
     and 32 rather than by eye at full size.

     The tile is there so the mark has an edge on any browser chrome. A
     transparent version read fine on a dark tab bar and disappeared on a light
     one. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#000000"/>
  <path d="M14 68 L50 18 L86 68" stroke="#ffffff" stroke-width="11" fill="none"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M32 84 L68 84" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
</svg>
